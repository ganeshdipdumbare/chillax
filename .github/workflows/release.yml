name: Release zip

on:
  push:
    tags:
      - "v*"

jobs:
  pack:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run pack
      - uses: softprops/action-gh-release@v2
        with:
          files: chillax-for-friends.zip
          generate_release_notes: true
