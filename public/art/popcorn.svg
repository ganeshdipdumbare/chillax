<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 140" role="img" aria-labelledby="popcorn-title">
  <title id="popcorn-title">A smiling popcorn bucket with a soda</title>
  <defs>
    <pattern id="cx-dots-popcorn" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="7" cy="7" r="1.05" fill="#e6c9b8" />
    </pattern>
    <style>
      .sparkle {
        transform-box: fill-box;
        transform-origin: center;
        animation: sparkle-twinkle 2.6s ease-in-out infinite;
      }
      .kernel-pop {
        transform-box: fill-box;
        transform-origin: 90px 42px;
        animation: kernel-pop 2.2s ease-in-out infinite;
      }
      @keyframes sparkle-twinkle {
        0%, 100% { opacity: 0.4; transform: scale(0.86); }
        50% { opacity: 1; transform: scale(1.12); }
      }
      @keyframes kernel-pop {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-2px); }
      }
      @media (prefers-reduced-motion: reduce) {
        .sparkle, .kernel-pop { animation: none; transform: none; }
      }
    </style>
  </defs>
  <rect width="180" height="140" fill="#f8dbca" />
  <rect width="180" height="140" fill="url(#cx-dots-popcorn)" />
  <g transform="translate(28 28)">
    <path class="sparkle" fill="#1c525d" d="M0 -5 C1.4 -1 1 -1.4 5 0 C1 1.4 1.4 1 0 5 C-1.4 1 -1 1.4 -5 0 C-1 -1.4 -1.4 -1 0 -5Z" />
  </g>
  <g transform="translate(156 34)">
    <path class="sparkle" fill="#adb49c" d="M0 -4.5 C1.4 -0.9 0.9 -1.4 4.5 0 C0.9 1.4 1.4 0.9 0 4.5 C-1.4 0.9 -0.9 1.4 -4.5 0 C-0.9 -1.4 -1.4 -0.9 0 -4.5Z" />
  </g>
  <g transform="translate(148 108)">
    <path class="sparkle" fill="#db704c" d="M0 -4 C1.4 -0.8 0.8 -1.4 4 0 C0.8 1.4 1.4 0.8 0 4 C-1.4 0.8 -0.8 1.4 -4 0 C-0.8 -1.4 -1.4 -0.8 0 -4Z" />
  </g>
  <ellipse cx="90" cy="118" rx="46" ry="10" fill="#e8c4b0" />
  <path d="M58 62h64l10 52H48Z" fill="#db704c" />
  <path d="M66 62h48l7 52H59Z" fill="#e8906f" />
  <path d="M70 78h8l3 36h-8Z" fill="#fbfaf4" opacity="0.55" />
  <path d="M102 78h8l3 36h-8Z" fill="#fbfaf4" opacity="0.55" />
  <ellipse cx="90" cy="62" rx="34" ry="13" fill="#fbfaf4" />
  <g class="kernel-pop">
    <circle cx="72" cy="48" r="11" fill="#fbfaf4" />
    <circle cx="90" cy="40" r="13" fill="#e8906f" />
    <circle cx="108" cy="50" r="11" fill="#db704c" />
    <circle cx="82" cy="34" r="8" fill="#fbfaf4" />
    <circle cx="100" cy="32" r="7" fill="#e8906f" />
    <circle cx="94" cy="50" r="8" fill="#fbfaf4" />
  </g>
  <circle cx="84" cy="82" r="2.1" fill="#0e1113" />
  <circle cx="96" cy="82" r="2.1" fill="#0e1113" />
  <circle cx="83.3" cy="81.2" r="0.65" fill="#fbfaf4" />
  <circle cx="95.3" cy="81.2" r="0.65" fill="#fbfaf4" />
  <ellipse cx="80" cy="88" rx="3.2" ry="1.6" fill="#db704c" opacity="0.5" />
  <ellipse cx="100" cy="88" rx="3.2" ry="1.6" fill="#db704c" opacity="0.5" />
  <path d="M86 93c2.4 3 6.6 3 9 0" fill="none" stroke="#0e1113" stroke-width="1.5" stroke-linecap="round" />
