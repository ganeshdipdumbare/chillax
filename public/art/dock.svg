<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-labelledby="dock-title">
  <title id="dock-title">Movie on the left, party chat docked on the right</title>
  <defs>
    <pattern id="cx-dots-dock" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="7" cy="7" r="1.05" fill="#e4d9cc" />
    </pattern>
    <style>
      .sparkle {
        transform-box: fill-box;
        transform-origin: center;
        animation: sparkle-twinkle 2.6s ease-in-out infinite;
      }
      .buddy-bob { animation: buddy-bob 3.4s ease-in-out infinite; }
      .buddy-bob-b { animation-delay: 0.55s; }
      .bubble-a { animation: bubble-pop 2.8s ease-in-out infinite; }
      .bubble-b { animation: bubble-pop 2.8s ease-in-out 0.7s infinite; }
      @keyframes sparkle-twinkle {
        0%, 100% { opacity: 0.4; transform: scale(0.86); }
        50% { opacity: 1; transform: scale(1.12); }
      }
      @keyframes buddy-bob {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-3px); }
      }
      @keyframes bubble-pop {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-3px); }
      }
      @media (prefers-reduced-motion: reduce) {
        .sparkle, .buddy-bob, .bubble-a, .bubble-b { animation: none; transform: none; }
      }
    </style>
  </defs>
  <rect width="320" height="200" fill="#f6f1ea" />
  <rect width="320" height="200" fill="url(#cx-dots-dock)" />
  <g transform="translate(28 30)">
    <path class="sparkle" fill="#c084fc" d="M0 -5 C1.4 -1 1 -1.4 5 0 C1 1.4 1.4 1 0 5 C-1.4 1 -1 1.4 -5 0 C-1 -1.4 -1.4 -1 0 -5Z" />
  </g>
  <g transform="translate(188 24)">
    <path class="sparkle" fill="#7dffd0" d="M0 -4.5 C1.4 -0.9 0.9 -1.4 4.5 0 C0.9 1.4 1.4 0.9 0 4.5 C-1.4 0.9 -0.9 1.4 -4.5 0 C-0.9 -1.4 -1.4 -0.9 0 -4.5Z" />
  </g>
  <ellipse cx="108" cy="176" rx="86" ry="12" fill="#eadfd3" />
  <rect x="22" y="48" width="168" height="96" rx="18" fill="#1c1524" />
  <rect x="34" y="60" width="144" height="72" rx="12" fill="#7dffd0" />
  <rect x="34" y="60" width="72" height="72" rx="12" fill="#c084fc" />
  <path d="M106 60h60a12 12 0 0 1 12 12v48a12 12 0 0 1-12 12h-60V60Z" fill="#f3c77e" />
  <rect x="78" y="146" width="56" height="7" rx="3.5" fill="#1c1524" />
  <g transform="translate(72 148) scale(0.72)">
    <g class="buddy-bob">
      <ellipse cx="0" cy="22" rx="18" ry="6" fill="#e4dbd1" opacity="0.7" />
      <ellipse cx="0" cy="10" rx="17" ry="15" fill="#ffd7a8" />
      <circle cx="0" cy="-8" r="13.5" fill="#ffd7a8" />
      <circle cx="-11" cy="8" r="5.5" fill="#ffd7a8" />
      <circle cx="11" cy="8" r="5.5" fill="#ffd7a8" />
      <circle cx="-4.6" cy="-10" r="2.15" fill="#1c1524" />
      <circle cx="4.6" cy="-10" r="2.15" fill="#1c1524" />
      <circle cx="-5.4" cy="-10.8" r="0.7" fill="#fff6e4" />
      <circle cx="3.8" cy="-10.8" r="0.7" fill="#fff6e4" />
      <ellipse cx="-7.2" cy="-5.6" rx="3.2" ry="1.7" fill="#ff8fa3" opacity="0.55" />
      <ellipse cx="7.2" cy="-5.6" rx="3.2" ry="1.7" fill="#ff8fa3" opacity="0.55" />
    </g>
  </g>
  <g transform="translate(128 146) scale(0.72)">
    <g class="buddy-bob buddy-bob-b">
      <ellipse cx="0" cy="22" rx="18" ry="6" fill="#e4dbd1" opacity="0.7" />
      <ellipse cx="0" cy="10" rx="17" ry="15" fill="#b8f5e0" />
      <circle cx="0" cy="-8" r="13.5" fill="#b8f5e0" />
      <circle cx="-11" cy="8" r="5.5" fill="#b8f5e0" />
      <circle cx="11" cy="8" r="5.5" fill="#b8f5e0" />
      <circle cx="-4.6" cy="-10" r="2.15" fill="#1c1524" />
      <circle cx="4.6" cy="-10" r="2.15" fill="#1c1524" />
      <circle cx="-5.4" cy="-10.8" r="0.7" fill="#fff6e4" />
      <circle cx="3.8" cy="-10.8" r="0.7" fill="#fff6e4" />
      <ellipse cx="-7.2" cy="-5.6" rx="3.2" ry="1.7" fill="#ff8fa3" opacity="0.55" />
      <ellipse cx="7.2" cy="-5.6" rx="3.2" ry="1.7" fill="#ff8fa3" opacity="0.55" />
    </g>
  </g>
  <rect x="206" y="22" width="96" height="156" rx="22" fill="#09060f" />
  <rect x="218" y="34" width="22" height="10" rx="5" fill="#7dffd0" />
  <rect x="244" y="37" width="40" height="5" rx="2.5" fill="#3a3144" />
  <rect class="bubble-a" x="218" y="58" width="64" height="22" rx="11" fill="#c084fc" />
  <rect class="bubble-b" x="232" y="88" width="54" height="22" rx="11" fill="#7dffd0" />
  <rect x="218" y="118" width="48" height="18" rx="9" fill="#3a3144" />
  <circle cx="230" cy="156" r="7" fill="#ffd7a8" />
  <rect x="242" y="150" width="44" height="14" rx="7" fill="#1c1524" stroke="#7dffd0" stroke-width="1.4" />
  <g transform="translate(292 48)">
    <path class="sparkle" fill="#f3c77e" d="M0 -4 C1.4 -0.8 0.8 -1.4 4 0 C0.8 1.4 1.4 0.8 0 4 C-1.4 0.8 -0.8 1.4 -4 0 C-0.8 -1.4 -1.4 -0.8 0 -4Z" />
  </g>
</svg>
