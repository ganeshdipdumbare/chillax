<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-labelledby="lounge-title">
  <title id="lounge-title">Two blob friends on a couch watching a movie</title>
  <defs>
    <pattern id="cx-dots-lounge" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="7" cy="7" r="1.05" fill="#aabbb6" />
    </pattern>
    <style>
      .sparkle {
        transform-box: fill-box;
        transform-origin: center;
        animation: sparkle-twinkle 2.6s ease-in-out infinite;
      }
      .buddy-bob { animation: buddy-bob 3.4s ease-in-out infinite; }
      .buddy-bob-b { animation-delay: 0.55s; }
      .lamp-glow { animation: lamp-pulse 2.8s ease-in-out infinite; }
      @keyframes sparkle-twinkle {
        0%, 100% { opacity: 0.4; transform: scale(0.86); }
        50% { opacity: 1; transform: scale(1.12); }
      }
      @keyframes buddy-bob {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-3px); }
      }
      @keyframes lamp-pulse {
        0%, 100% { opacity: 0.78; }
        50% { opacity: 1; }
      }
      @media (prefers-reduced-motion: reduce) {
        .sparkle, .buddy-bob, .lamp-glow { animation: none; transform: none; }
      }
    </style>
  </defs>
  <rect width="320" height="200" fill="#c3d3ce" />
  <rect width="320" height="200" fill="url(#cx-dots-lounge)" />
  <ellipse cx="160" cy="176" rx="118" ry="14" fill="#b3c4bf" />
