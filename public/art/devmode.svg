<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-labelledby="devmode-title">
  <title id="devmode-title">A blob in a hard hat celebrating after flipping on Developer mode</title>
  <defs>
    <pattern id="devmode-dots" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="7" cy="7" r="1.05" fill="#aabbb6" />
    </pattern>
    <style>
      .ink { stroke: #0e1113; stroke-width: 3; stroke-linejoin: round; stroke-linecap: round; }
      .thin { stroke: #0e1113; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
      .cheer { transform-box: fill-box; transform-origin: 50% 100%; animation: cheer 0.9s cubic-bezier(0.3, 0, 0.3, 1) infinite; }
      .knob { animation: knob 4s cubic-bezier(0.6, 0, 0.2, 1) infinite; }
      .track { animation: track 4s cubic-bezier(0.6, 0, 0.2, 1) infinite; }
      .twinkle { transform-box: fill-box; transform-origin: center; animation: twinkle 1.6s ease-in-out infinite; }
      .sweat { animation: sweat 0.9s ease-in infinite; }
      @keyframes cheer { 0%, 100% { transform: translateY(0) scale(1, 1); } 40% { transform: translateY(-8px) scale(0.97, 1.03); } 70% { transform: translateY(0) scale(1.03, 0.97); } }
      @keyframes knob { 0%, 8% { transform: translateX(-78px); } 22%, 92% { transform: translateX(0); } 100% { transform: translateX(-78px); } }
      @keyframes track { 0%, 8% { fill: #adb49c; } 22%, 92% { fill: #1c525d; } 100% { fill: #adb49c; } }
      @keyframes twinkle { 0%, 100% { opacity: 0.3; transform: scale(0.7) rotate(0deg); } 50% { opacity: 1; transform: scale(1.2) rotate(45deg); } }
      @keyframes sweat { 0% { transform: translate(0, 0); opacity: 1; } 100% { transform: translate(-6px, 14px); opacity: 0; } }
      @media (prefers-reduced-motion: reduce) {
        .cheer, .knob, .track, .twinkle, .sweat { animation: none; }
      }
    </style>
  </defs>
  <rect width="320" height="200" fill="#c3d3ce" />
  <rect width="320" height="200" fill="url(#devmode-dots)" />
  <ellipse cx="240" cy="186" rx="52" ry="7" fill="#0e1113" opacity="0.14" />

  <!-- The famous switch -->
  <text x="26" y="62" font-family="Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="800" letter-spacing="1.4" fill="#1c525d">DEVELOPER MODE</text>
  <rect class="track" x="24" y="72" width="152" height="68" rx="34" fill="#1c525d" stroke="#0e1113" stroke-width="3.5" />
  <text x="44" y="112" font-family="Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="800" fill="#fbfaf4">ON</text>
  <g class="knob">
    <circle cx="142" cy="106" r="27" fill="#fbfaf4" class="ink" />
    <path d="M132 100q4-5 8 0M146 100q4-5 8 0" class="thin" fill="none" />
    <path d="M136 112q6 6 12 0" class="thin" fill="none" />
  </g>
  <path class="twinkle thin" d="M184 62l3 7 7 3-7 3-3 7-3-7-7-3 7-3z" fill="#f6c453" />
  <path class="twinkle" style="animation-delay: 0.5s" d="M20 154l2 5 5 2-5 2-2 5-2-5-5-2 5-2z" fill="#db704c" />

  <!-- Wrench, used for nothing -->
  <g transform="rotate(-16 110 176)">
    <rect x="72" y="171" width="60" height="11" rx="5.5" fill="#adb49c" class="thin" />
    <circle cx="140" cy="176" r="12" fill="#adb49c" class="thin" />
    <rect x="142" y="171" width="13" height="10" fill="#c3d3ce" />
  </g>

  <!-- Speech bubble -->
  <path d="M190 10h110a10 10 0 0 1 10 10v20a10 10 0 0 1-10 10h-46l-10 10-2-10h-52a10 10 0 0 1-10-10v-20a10 10 0 0 1 10-10z" fill="#fbfaf4" class="thin" />
  <text x="245" y="34" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#0e1113">I&#8217;m a developer now.</text>

  <!-- The new developer -->
  <g class="cheer">
    <path d="M206 140l-18-28M274 140l18-28" stroke="#0e1113" stroke-width="15" stroke-linecap="round" />
    <path d="M206 140l-18-28M274 140l18-28" stroke="#d6d0c3" stroke-width="9" stroke-linecap="round" />
    <path d="M196 184c-5-50 14-86 44-86s49 36 44 86z" fill="#d6d0c3" class="ink" />
    <path d="M208 104c0-26 64-26 64 0z" fill="#f6c453" class="ink" />
    <rect x="200" y="100" width="80" height="9" rx="4.5" fill="#f6c453" class="ink" />
    <path d="M240 82v14" stroke="#0e1113" stroke-width="2.5" stroke-linecap="round" />
    <path d="M222 130q6-8 12 0M246 130q6-8 12 0" class="ink" fill="none" />
    <path d="M226 142h28c0 12-7 18-14 18s-14-6-14-18z" fill="#0e1113" class="thin" />
    <path d="M232 154c4-3 12-3 16 0-4 3-12 3-16 0z" fill="#db704c" />
    <ellipse cx="216" cy="144" rx="6" ry="3.5" fill="#db704c" opacity="0.45" />
    <ellipse cx="264" cy="144" rx="6" ry="3.5" fill="#db704c" opacity="0.45" />
  </g>
  <path class="sweat" d="M204 118c0 0-5 7-5 10a5 5 0 0 0 10 0c0-3-5-10-5-10z" fill="#9fd0de" stroke="#0e1113" stroke-width="2" />
</svg>
