<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-labelledby="chat-title">
  <title id="chat-title">A horror movie on the left, a party chat on the right yelling don't open it, one blob hiding behind a pillow and one calmly eating popcorn</title>
  <defs>
    <pattern id="chat-dots" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="7" cy="7" r="1.05" fill="#aabbb6" />
    </pattern>
    <clipPath id="chat-screen">
      <rect x="26" y="34" width="162" height="92" rx="10" />
    </clipPath>
    <style>
      .ink { stroke: #0e1113; stroke-width: 3; stroke-linejoin: round; stroke-linecap: round; }
      .thin { stroke: #0e1113; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
      .shiver { animation: shiver 0.16s linear infinite alternate; }
      .peek { animation: peek 3.2s ease-in-out infinite; }
      .chew { transform-box: fill-box; transform-origin: center; animation: chew 0.5s ease-in-out infinite alternate; }
      .dot { animation: dot 1.2s ease-in-out infinite; }
      .dot-b { animation-delay: 0.2s; }
      .dot-c { animation-delay: 0.4s; }
      @keyframes shiver { from { transform: translateX(-1px); } to { transform: translateX(1px); } }
      @keyframes peek { 0%, 30%, 100% { transform: translateX(0); } 45%, 80% { transform: translateX(-12px); } }
      @keyframes chew { from { transform: scaleY(1); } to { transform: scaleY(0.4); } }
      @keyframes dot { 0%, 60%, 100% { transform: translateY(0); opacity: 0.5; } 30% { transform: translateY(-3px); opacity: 1; } }
      @media (prefers-reduced-motion: reduce) {
        .shiver, .peek, .chew, .dot { animation: none; }
      }
    </style>
  </defs>
  <rect width="320" height="200" fill="#c3d3ce" />
  <rect width="320" height="200" fill="url(#chat-dots)" />

  <!-- The TV, playing something extremely ill-advised -->
  <rect x="16" y="24" width="182" height="112" rx="16" fill="#0e1113" />
  <rect x="26" y="34" width="162" height="92" rx="10" fill="#0e2a31" />
  <g clip-path="url(#chat-screen)">
    <rect x="26" y="112" width="162" height="14" fill="#163f48" />
    <rect x="122" y="54" width="40" height="64" fill="#081c21" />
    <path d="M122 54l-12 6v62l12-4z" fill="#1c525d" stroke="#c3d3ce" stroke-width="1.5" stroke-linejoin="round" />
    <g class="peek">
      <path d="M138 118v-36c0-10 6-16 14-16s14 6 14 16v36l-5-4-4 4-5-4-4 4-5-4z" fill="#fbfaf4" />
      <ellipse cx="147" cy="82" rx="2.6" ry="3.6" fill="#0e1113" />
      <ellipse cx="157" cy="82" rx="2.6" ry="3.6" fill="#0e1113" />
      <ellipse cx="152" cy="94" rx="3.5" ry="4.5" fill="#0e1113" />
    </g>
    <path d="M76 118c-2-24 8-38 20-38s22 14 20 38z" fill="#f8dbca" />
    <circle cx="102" cy="94" r="2" fill="#0e1113" />
    <circle cx="110" cy="94" r="2" fill="#0e1113" />
    <path d="M112 104l14-4" stroke="#f8dbca" stroke-width="5" stroke-linecap="round" />
    <circle cx="44" cy="52" r="1.8" fill="#db704c" />
    <circle cx="50" cy="52" r="1.8" fill="#db704c" />
  </g>
  <rect x="80" y="138" width="54" height="6" rx="3" fill="#0e1113" />

  <!-- Viewer one: behind the pillow, regretting everything -->
  <g class="shiver">
    <path d="M30 200c-4-36 10-62 32-62s36 26 32 62z" fill="#f8dbca" class="ink" />
    <circle cx="54" cy="160" r="7" fill="#fbfaf4" class="thin" />
    <circle cx="72" cy="160" r="7" fill="#fbfaf4" class="thin" />
    <circle cx="55" cy="161" r="2.8" fill="#0e1113" />
    <circle cx="73" cy="161" r="2.8" fill="#0e1113" />
    <path d="M86 146c0 0-5 7-5 10a5 5 0 0 0 10 0c0-3-5-10-5-10z" fill="#9fd0de" class="thin" />
  </g>
  <rect x="34" y="168" width="58" height="40" rx="12" fill="#db704c" class="ink" transform="rotate(-8 63 188)" />
  <path d="M46 180l34-5" stroke="#fbfaf4" stroke-width="2" stroke-linecap="round" opacity="0.6" />

  <!-- Viewer two: has seen worse -->
  <path d="M118 200c-4-34 10-58 30-58s34 24 30 58z" fill="#adb49c" class="ink" />
  <path d="M134 166h8M154 166h8" class="ink" fill="none" />
  <ellipse class="chew" cx="148" cy="180" rx="6" ry="3" fill="#0e1113" />
  <path d="M172 190h22l-3 14h-16z" fill="#fbfaf4" class="thin" />
  <path d="M180 190l-1 14M186 190l-1 14" stroke="#db704c" stroke-width="3" />
  <circle cx="178" cy="187" r="4" fill="#fbfaf4" class="thin" />
  <circle cx="186" cy="185" r="4.5" fill="#fbfaf4" class="thin" />

  <!-- The party chat, docked right -->
  <rect x="208" y="12" width="102" height="178" rx="18" fill="#0e1113" />
  <g stroke="#0e1113" stroke-width="2">
    <circle cx="224" cy="30" r="7" fill="#f8dbca" />
    <circle cx="236" cy="30" r="7" fill="#adb49c" />
    <circle cx="248" cy="30" r="7" fill="#db704c" />
  </g>
  <text x="260" y="34" font-family="Helvetica Neue, Arial, sans-serif" font-size="10" font-weight="700" fill="#adb49c">3 here</text>
  <g font-family="Helvetica Neue, Arial, sans-serif" font-size="9.5" font-weight="700">
    <rect x="218" y="48" width="78" height="20" rx="10" fill="#adb49c" />
    <text x="228" y="61.5" fill="#0e1113">don&#8217;t open it</text>
    <rect x="228" y="74" width="72" height="20" rx="10" fill="#f8dbca" />
    <text x="238" y="87.5" fill="#0e1113">NOOOOOO</text>
    <rect x="218" y="100" width="84" height="20" rx="10" fill="#db704c" />
    <text x="227" y="113.5" fill="#0e1113">she opened it &#128128;</text>
  </g>
  <rect x="218" y="128" width="42" height="18" rx="9" fill="#2c3134" />
  <circle class="dot" cx="230" cy="137" r="2.6" fill="#fbfaf4" />
  <circle class="dot dot-b" cx="239" cy="137" r="2.6" fill="#fbfaf4" />
  <circle class="dot dot-c" cx="248" cy="137" r="2.6" fill="#fbfaf4" />
  <rect x="218" y="160" width="82" height="20" rx="10" fill="none" stroke="#2c3134" stroke-width="2" />
  <text x="228" y="173.5" font-family="Helvetica Neue, Arial, sans-serif" font-size="9.5" fill="#6b7377">say something&#8230;</text>
</svg>
