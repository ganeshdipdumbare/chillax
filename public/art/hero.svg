<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-labelledby="hero-title">
  <title id="hero-title">One couch split across two homes: a friend sobbing at 3pm, a friend howling with laughter at 2am, popcorn flying between them, and a sleepy puppy</title>
  <defs>
    <pattern id="hero-dots-day" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="8" cy="8" r="1.2" fill="#ecc3ad" />
    </pattern>
    <pattern id="hero-dots-night" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="8" cy="8" r="1.2" fill="#24606c" />
    </pattern>
    <clipPath id="hero-night">
      <rect x="320" y="0" width="320" height="400" />
    </clipPath>
    <clipPath id="hero-couch">
      <rect x="70" y="194" width="500" height="100" rx="31" />
      <rect x="60" y="270" width="520" height="56" rx="19" />
      <rect x="32" y="234" width="60" height="100" rx="26" />
      <rect x="548" y="234" width="60" height="100" rx="26" />
    </clipPath>
    <clipPath id="hero-sky-day">
      <rect x="40" y="40" width="112" height="92" rx="14" />
    </clipPath>
    <clipPath id="hero-dog-head">
      <circle cx="554" cy="166" r="24" />
    </clipPath>
    <clipPath id="hero-dog-body">
      <ellipse cx="594" cy="188" rx="30" ry="16" />
    </clipPath>
    <style>
      .ink { stroke: #0e1113; stroke-width: 3.5; stroke-linejoin: round; stroke-linecap: round; }
      .thin { stroke: #0e1113; stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
      .sob { transform-box: fill-box; transform-origin: 50% 100%; animation: sob 0.5s ease-in-out infinite alternate; }
      .howl { transform-box: fill-box; transform-origin: 50% 100%; animation: howl 0.42s ease-in-out infinite alternate; }
      .tear { animation: tear 1.1s ease-in infinite; }
      .tear-b { animation-delay: 0.55s; }
      .kernel { offset-path: path("M505 236 Q380 40 206 186"); offset-rotate: 0deg; animation: fling 2.6s cubic-bezier(0.3, 0.1, 0.6, 1) infinite; }
      .kernel-b { animation-delay: 0.9s; }
      .kernel-c { animation-delay: 1.75s; }
      .dog-tail { transform-box: fill-box; transform-origin: 0% 100%; animation: tail 2.2s ease-in-out infinite; }
      .twinkle { transform-box: fill-box; transform-origin: center; animation: twinkle 2.2s ease-in-out infinite; }
      .snore { animation: snore 3s ease-in-out infinite; }
      @keyframes sob { from { transform: translateY(0) scaleY(1); } to { transform: translateY(1.5px) scaleY(0.97); } }
      @keyframes howl { from { transform: rotate(-7deg); } to { transform: rotate(-3deg) translateY(-2px); } }
      @keyframes tear { 0% { transform: translateY(-4px); opacity: 0; } 20% { opacity: 1; } 100% { transform: translateY(26px); opacity: 0; } }
      @keyframes fling { 0% { offset-distance: 0%; opacity: 0; } 8% { opacity: 1; } 92% { opacity: 1; } 100% { offset-distance: 100%; opacity: 0; } }
      @keyframes tail { 0%, 100% { transform: rotate(-8deg); } 50% { transform: rotate(18deg); } }
      @keyframes twinkle { 0%, 100% { opacity: 0.35; transform: scale(0.8); } 50% { opacity: 1; transform: scale(1.15); } }
      @keyframes snore { 0%, 100% { opacity: 0.2; transform: translate(0, 0); } 50% { opacity: 1; transform: translate(4px, -5px); } }
      @media (prefers-reduced-motion: reduce) {
        .sob, .howl, .tear, .kernel, .dog-tail, .twinkle, .snore { animation: none; }
        .kernel { offset-distance: 55%; }
      }
    </style>
  </defs>

  <!-- Day room -->
  <rect width="320" height="400" fill="#f8dbca" />
  <rect width="320" height="400" fill="url(#hero-dots-day)" />
  <rect y="322" width="320" height="78" fill="#efc7b1" />
  <path d="M0 322h320" class="thin" fill="none" opacity="0.5" />

  <!-- Night room -->
  <rect x="320" width="320" height="400" fill="#1c525d" />
  <rect x="320" width="320" height="400" fill="url(#hero-dots-night)" />
  <rect x="320" y="322" width="320" height="78" fill="#163f48" />
  <path d="M320 322h320" class="thin" fill="none" opacity="0.5" />

  <!-- Day window: sun in sunglasses -->
  <rect x="40" y="40" width="112" height="92" rx="14" fill="#cfe6ea" />
  <g clip-path="url(#hero-sky-day)">
    <g stroke="#f2b33d" stroke-width="4" stroke-linecap="round">
      <path d="M96 52v-8M96 120v8M60 86h-8M140 86h-8M71 61l-6-6M121 61l6-6M71 111l-6 6M121 111l6 6" />
    </g>
    <circle cx="96" cy="86" r="22" fill="#f6c453" class="thin" />
    <path d="M80 80h12l-1 7a5 5 0 0 1-5 4h0a5 5 0 0 1-5-4zM100 80h12l-1 7a5 5 0 0 1-5 4h0a5 5 0 0 1-5-4z" fill="#0e1113" />
    <path d="M92 81h8" class="thin" fill="none" />
    <path d="M88 97q8 6 16 0" class="thin" fill="none" />
    <path d="M118 120c4-8 18-8 22 0" fill="#fbfaf4" class="thin" />
  </g>
  <rect x="40" y="40" width="112" height="92" rx="14" fill="none" class="ink" />

  <!-- Night window: moon in a nightcap -->
  <rect x="488" y="40" width="112" height="92" rx="14" fill="#0e2a31" />
  <path class="twinkle" d="M512 60l2 5 5 2-5 2-2 5-2-5-5-2 5-2z" fill="#f8dbca" />
  <path class="twinkle" style="animation-delay: 0.8s" d="M582 110l1.6 4 4 1.6-4 1.6-1.6 4-1.6-4-4-1.6 4-1.6z" fill="#adb49c" />
  <circle cx="545" cy="92" r="21" fill="#fbfaf4" class="thin" />
  <path d="M528 76c4-20 26-26 42-16l10 -10c4 0 6 4 4 6l-8 8c4 6 0 8-4 6-12-6-30-4-44 6z" fill="#db704c" class="thin" />
  <circle cx="586" cy="50" r="5" fill="#fbfaf4" class="thin" />
  <path d="M533 92q4 4 8 0M549 92q4 4 8 0" class="thin" fill="none" />
  <ellipse cx="545" cy="103" rx="3.5" ry="2.5" fill="#0e1113" />
  <g class="snore" font-family="Helvetica Neue, Arial, sans-serif" font-weight="700" fill="#c3d3ce">
    <text x="566" y="88" font-size="11">z</text>
    <text x="574" y="78" font-size="8">z</text>
  </g>
  <rect x="488" y="40" width="112" height="92" rx="14" fill="none" class="ink" />

  <!-- Wall clocks: 3:00 PM here, 2:00 AM there -->
  <circle cx="232" cy="72" r="20" fill="#fbfaf4" class="ink" />
  <path d="M232 72v-13M232 72h10" class="thin" fill="none" />
  <circle cx="408" cy="72" r="20" fill="#fbfaf4" class="ink" />
  <path d="M408 72v-13M408 72l8.5-5" class="thin" fill="none" />
  <g font-family="Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="0.5">
    <text x="232" y="110" fill="#1c525d">3:00 PM</text>
    <text x="408" y="110" fill="#f8dbca">2:00 AM</text>
  </g>

  <!-- Couch -->
  <ellipse cx="320" cy="340" rx="280" ry="10" fill="#0e1113" opacity="0.16" />
  <rect x="84" y="322" width="14" height="18" rx="4" fill="#0e1113" />
  <rect x="542" y="322" width="14" height="18" rx="4" fill="#0e1113" />
  <rect x="72" y="196" width="496" height="96" rx="30" fill="#db704c" class="ink" />
  <path d="M196 206v70M444 206v70" class="thin" fill="none" opacity="0.4" />
  <rect x="62" y="272" width="516" height="52" rx="18" fill="#e8906f" class="ink" />
  <path d="M196 278v40M444 278v40" class="thin" fill="none" opacity="0.4" />
  <rect x="34" y="236" width="56" height="96" rx="24" fill="#db704c" class="ink" />
  <rect x="550" y="236" width="56" height="96" rx="24" fill="#db704c" class="ink" />
  <g clip-path="url(#hero-night)">
    <g clip-path="url(#hero-couch)">
      <rect x="320" y="190" width="300" height="150" fill="#0e1113" opacity="0.2" />
    </g>
  </g>

  <!-- Tissue box and casualties -->
  <rect x="100" y="244" width="46" height="30" rx="5" fill="#fbfaf4" class="ink" />
  <path d="M112 252h22" class="thin" fill="none" />
  <path d="M116 252c-6-14 4-20 8-12 2-10 14-8 10 2 0 4-2 8-4 10" fill="#fbfaf4" class="thin" />
  <g fill="#fbfaf4" class="thin">
    <path d="M60 352c-4-8 6-14 12-8 6-6 16 0 10 8 4 6-4 12-10 8-6 4-16-2-12-8z" />
    <path d="M112 368c-4-7 5-12 10-7 5-5 14 0 9 7 3 5-4 10-9 7-5 3-14-2-10-7z" />
    <path d="M160 350c-3-6 4-10 8-6 4-4 11 0 7 6 3 4-3 8-7 6-4 3-11-2-8-6z" />
    <path d="M30 380c-3-6 4-10 8-6 4-4 11 0 7 6 3 4-3 8-7 6-4 3-11-2-8-6z" />
  </g>
  <path d="M118 360l6 4M66 350l8 3" class="thin" fill="none" opacity="0.5" />

  <!-- Day friend: absolutely sobbing -->
  <g class="sob">
    <path d="M142 292c-6-58 18-104 52-104s58 46 52 104z" fill="#adb49c" class="ink" />
    <path d="M166 226l14 7-14 7M222 226l-14 7 14 7" class="ink" fill="none" />
    <path d="M178 256c0-10 32-10 32 0 0 14-8 20-16 20s-16-6-16-20z" fill="#0e1113" />
    <path d="M184 270c4-5 16-5 20 0-4 4-16 4-20 0z" fill="#db704c" />
    <path d="M168 242c-6 14-4 30 -10 46M220 242c6 14 4 30 10 46" stroke="#7fb6c6" stroke-width="7" stroke-linecap="round" fill="none" />
    <path d="M246 268c10-4 16 4 12 10" fill="#adb49c" class="ink" />
    <path d="M250 262c-4-10 4-18 12-12 6-6 16 2 10 10 4 8-6 14-12 8-6 4-12-2-10-6z" fill="#fbfaf4" class="thin" />
  </g>
  <path class="tear thin" d="M152 214c0 0-6 8-6 12a6 6 0 0 0 12 0c0-4-6-12-6-12z" fill="#9fd0de" />
  <path class="tear tear-b thin" d="M238 212c0 0-6 8-6 12a6 6 0 0 0 12 0c0-4-6-12-6-12z" fill="#9fd0de" />
  <circle cx="204" cy="190" r="7" fill="#fbfaf4" class="thin" />
  <text x="88" y="196" font-family="Helvetica Neue, Arial, sans-serif" font-size="15" font-style="italic" font-weight="700" fill="#1c525d" transform="rotate(-8 88 196)">*sob*</text>

  <!-- Popcorn flying across the gap -->
  <path d="M505 236Q380 40 206 186" fill="none" stroke="#0e1113" stroke-width="2" stroke-dasharray="2 9" stroke-linecap="round" opacity="0.35" />
  <g class="kernel"><circle r="7" fill="#fbfaf4" class="thin" /></g>
  <g class="kernel kernel-b"><circle r="6" fill="#f6c453" class="thin" /></g>
  <g class="kernel kernel-c"><circle r="6.5" fill="#fbfaf4" class="thin" /></g>

  <!-- Night friend: dying of laughter -->
  <g class="howl">
    <path d="M398 292c-6-58 18-104 52-104s58 46 52 104z" fill="#fbfaf4" class="ink" />
    <path d="M422 232q8-12 16 0M462 232q8-12 16 0" class="ink" fill="none" />
    <path d="M426 248h48c0 22-12 32-24 32s-24-10-24-32z" fill="#0e1113" class="thin" />
    <path d="M436 270c6-6 22-6 28 0-6 8-22 8-28 0z" fill="#db704c" />
    <path d="M428 249h44" stroke="#fbfaf4" stroke-width="4" stroke-linecap="round" />
    <ellipse cx="416" cy="250" rx="7" ry="4" fill="#db704c" opacity="0.5" />
    <ellipse cx="484" cy="250" rx="7" ry="4" fill="#db704c" opacity="0.5" />
    <path d="M412 228c-4 4-6 8-2 10M488 228c4 4 6 8 2 10" stroke="#9fd0de" stroke-width="4" stroke-linecap="round" fill="none" />
  </g>
  <g transform="rotate(-10 508 270)">
    <path d="M490 246h36l-5 42h-26z" fill="#fbfaf4" class="ink" />
    <path d="M499 246l2 42M517 246l-2 42" stroke="#db704c" stroke-width="6" />
    <path d="M490 246h36l-5 42h-26z" fill="none" class="ink" />
    <g fill="#fbfaf4" class="thin">
      <circle cx="496" cy="242" r="7" />
      <circle cx="508" cy="236" r="8" />
      <circle cx="520" cy="242" r="7" />
    </g>
  </g>
  <g font-family="Helvetica Neue, Arial, sans-serif" font-weight="800" fill="#f6c453">
    <text x="372" y="184" font-size="20" transform="rotate(-14 372 184)">HA</text>
    <text x="448" y="158" font-size="26" transform="rotate(8 448 158)">HA!</text>
  </g>

  <!-- The puppy, who has seen this movie and is napping through it -->
  <ellipse cx="578" cy="204" rx="48" ry="6" fill="#0e1113" opacity="0.18" />
  <g>
    <path class="dog-tail" d="M608 186c14-2 18-16 8-24" stroke="#0e1113" stroke-width="10" stroke-linecap="round" fill="none" />
    <path class="dog-tail" d="M608 186c14-2 18-16 8-24" stroke="#c99a5a" stroke-width="5" stroke-linecap="round" fill="none" />
    <path d="M542 156c-8 4-24 12-26 26-2 12 10 18 20 12 8-5 16-18 16-28 0-6-4-10-10-10z" fill="#c99a5a" class="ink" />
    <ellipse cx="522" cy="178" rx="5" ry="9" transform="rotate(-16 522 178)" fill="#f8dbca" />
    <ellipse cx="594" cy="188" rx="30" ry="16" fill="#fbfaf4" class="ink" />
    <g clip-path="url(#hero-dog-body)">
      <ellipse cx="610" cy="182" rx="13" ry="11" fill="#c99a5a" />
    </g>
    <ellipse cx="612" cy="200" rx="10" ry="6" fill="#fbfaf4" class="ink" />
    <path d="M566 156c8 4 24 12 26 26 2 12-10 18-20 12-8-5-16-18-16-28 0-6 4-10 10-10z" fill="#c99a5a" class="ink" />
    <ellipse cx="586" cy="178" rx="5" ry="9" transform="rotate(16 586 178)" fill="#f8dbca" />
    <circle cx="554" cy="166" r="24" fill="#fbfaf4" class="ink" />
    <g clip-path="url(#hero-dog-head)">
      <ellipse cx="540" cy="154" rx="7" ry="8" fill="#c99a5a" />
      <ellipse cx="568" cy="156" rx="13" ry="14" fill="#c99a5a" />
    </g>
    <path d="M540 162q6-7 12 0" class="ink" fill="none" />
    <path d="M558 162q6-7 12 0" class="ink" fill="none" />
    <ellipse cx="536" cy="172" rx="5" ry="3.2" fill="#db704c" opacity="0.4" />
    <ellipse cx="572" cy="172" rx="5" ry="3.2" fill="#db704c" opacity="0.4" />
    <ellipse cx="554" cy="174" rx="4.2" ry="3.4" fill="#0e1113" />
    <circle cx="552.6" cy="172.8" r="1.1" fill="#fbfaf4" />
    <ellipse cx="540" cy="198" rx="9" ry="6" fill="#fbfaf4" class="ink" />
    <ellipse cx="562" cy="200" rx="10" ry="6.5" fill="#fbfaf4" class="ink" />
  </g>

  <!-- The seam between two living rooms -->
  <path d="M320 0v400" stroke="#fbfaf4" stroke-width="3" stroke-dasharray="1 10" stroke-linecap="round" opacity="0.9" />
  <rect x="294" y="296" width="52" height="30" rx="15" fill="#0e1113" stroke="#fbfaf4" stroke-width="2.5" />
  <path d="M320 318c-10-6-12-10-12-13a5 5 0 0 1 12-2 5 5 0 0 1 12 2c0 3-2 7-12 13z" fill="#db704c" />
</svg>
