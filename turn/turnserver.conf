# Runs behind `ngrok tcp 3478`, which forwards TCP only. The relay ports are never reachable from
# outside, so this only works when both browsers relay through this server; coturn then passes
# traffic between the two allocations internally on relay-ip.
use-auth-secret
realm=chillax
fingerprint

listening-port=3478
relay-ip=172.31.250.2
allowed-peer-ip=172.31.250.2
min-port=49160
max-port=49200
no-tls
no-dtls

total-quota=100
user-quota=12
stale-nonce=600
no-multicast-peers
no-cli
log-file=stdout

# Never relay into private networks, so the server can't be used to reach the host's LAN.
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff
