<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Chillax icon render</title>
    <style>
      body {
        margin: 24px;
        background: #d6d0c3;
        color: #0e1113;
        font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      }
      .row {
        display: flex;
        gap: 24px;
        align-items: end;
        flex-wrap: wrap;
      }
      figure {
        margin: 0;
        text-align: center;
      }
      figcaption {
        margin-top: 8px;
        font-size: 12px;
      }
      .css {
        display: grid;
        place-items: center;
        background: #0e1113;
        color: #fbfaf4;
        font-weight: 700;
        letter-spacing: -0.04em;
        line-height: 1;
        box-shadow: 3px 3px 0 #db704c;
        transform: rotate(-4deg);
      }
    </style>
  </head>
  <body>
    <p>Site mark vs toolbar PNG recipe</p>
    <div class="row" id="row"></div>
    <script>
      const sizes = [16, 32, 48, 128];

      function render(size) {
        const canvas = document.createElement("canvas");
        canvas.width = size;
        canvas.height = size;
        const ctx = canvas.getContext("2d");
        const rotate = size >= 48;
        const offset = size <= 16 ? 1 : size <= 32 ? 2 : size <= 48 ? 3 : 8;
        const pad = size <= 32 ? 0 : size <= 48 ? 2 : 8;
        const side = size - pad * 2 - offset;
        const radius = Math.max(1, (side * 12) / 38);
        const label = size <= 16 ? "C" : "Cx";
        ctx.translate(size / 2, size / 2);
        if (rotate) ctx.rotate((-4 * Math.PI) / 180);
        ctx.translate(-side / 2 - offset / 2, -side / 2 - offset / 2);
        ctx.fillStyle = "#db704c";
        ctx.beginPath();
        ctx.roundRect(offset, offset, side, side, radius);
        ctx.fill();
        ctx.fillStyle = "#0e1113";
        ctx.beginPath();
        ctx.roundRect(0, 0, side, side, radius);
        ctx.fill();
        ctx.fillStyle = "#fbfaf4";
        ctx.font = `700 ${(side * (label === "C" ? 0.56 : 0.37)) | 0}px "Helvetica Neue", Helvetica, Arial, sans-serif`;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(label, side / 2, side / 2 + side * 0.02);
        return canvas;
      }

      const row = document.getElementById("row");
      for (const size of sizes) {
        const css = document.createElement("div");
        css.className = "css";
        css.style.width = `${size}px`;
        css.style.height = `${size}px`;
        css.style.borderRadius = `${(size * 12) / 38}px`;
        css.style.fontSize = `${(size * 14) / 38}px`;
        css.style.boxShadow = size <= 32 ? "2px 2px 0 #db704c" : "3px 3px 0 #db704c";
        css.style.transform = size < 48 ? "none" : "rotate(-4deg)";
        css.textContent = size <= 16 ? "C" : "Cx";
        const canvas = render(size);
        for (const node of [css, canvas]) {
          const figure = document.createElement("figure");
          figure.append(node);
          const cap = document.createElement("figcaption");
          cap.textContent = `${size} ${node.tagName === "CANVAS" ? "canvas" : "css"}`;
          figure.append(cap);
          row.append(figure);
        }
      }
    </script>
  </body>
</html>
